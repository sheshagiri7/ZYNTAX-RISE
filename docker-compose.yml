version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. GRAPH DATABASE (Neo4j 5.x Community - Pinned Version)
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26.0-community
    container_name: zyntax-neo4j
    environment:
      - NEO4J_AUTH=neo4j/csvgraphdb
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p csvgraphdb 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - zyntax-network

  # ---------------------------------------------------------------------------
  # 2. MESSAGE BROKER (Apache Kafka 3.7.0 KRaft Mode - Pinned Version)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: zyntax-kafka
    environment:
      # KRaft mode (no zookeeper required)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - zyntax-network

  # ---------------------------------------------------------------------------
  # 3. BACKEND REST API (Flask 3.1.3 / Python 3.11)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: zyntax-api
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=csv-rows
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=csvgraphdb
      - NEO4J_DATABASE=CSV_Graph_DB
    ports:
      - "5000:5000"
    volumes:
      - job_state:/app/.state
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - zyntax-network

  # ---------------------------------------------------------------------------
  # 4. KAFKA TO NEO4J LOADER DAEMON
  # ---------------------------------------------------------------------------
  loader:
    build:
      context: .
      dockerfile: Dockerfile.loader
    container_name: zyntax-loader
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=csv-rows
      - KAFKA_GROUP_ID=zyntax-loader-group
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=csvgraphdb
      - NEO4J_DATABASE=CSV_Graph_DB
    volumes:
      - job_state:/app/.state
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - zyntax-network

  # ---------------------------------------------------------------------------
  # 5. FRONTEND UI (Member 1 Web Service Placeholder)
  # ---------------------------------------------------------------------------
  ui:
    image: nginx:1.27.4-alpine
    container_name: zyntax-ui
    ports:
      - "3000:80"
    networks:
      - zyntax-network

networks:
  zyntax-network:
    driver: bridge

volumes:
  neo4j_data:
  kafka_data:
  job_state:
